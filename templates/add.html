{% extends "base.html" %}
{% block content %}

<div class="max-w-xl space-y-4">
  <h2 class="text-lg font-semibold">Gegenstand hinzufuegen</h2>

  {% if error %}
    <div class="bg-red-900/40 border border-red-800 rounded px-3 py-2 text-sm text-red-200">
      {{ error }}
    </div>
  {% endif %}

  <form method="post" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
      <label class="block text-sm mb-2">Typ</label>
      <div class="flex gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="item_type" value="inventory"
                 {{ 'checked' if (it.item_type or 'inventory') == 'inventory' else '' }}
                 onchange="updateBuyVisibility()"
                 class="accent-amber-500" />
          <span class="text-sm">Inventar <span class="text-slate-400">(bereits gekauft)</span></span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="item_type" value="tracking"
                 {{ 'checked' if it.item_type == 'tracking' else '' }}
                 onchange="updateBuyVisibility()"
                 class="accent-amber-500" />
          <span class="text-sm">Tracking <span class="text-slate-400">(Wunschliste)</span></span>
        </label>
      </div>
    </div>

    <div>
      <label class="block text-sm mb-1">Steam-Market-URL</label>
      <input name="steam_url" value="{{ it.steam_url or '' }}"
             placeholder="https://steamcommunity.com/market/listings/730/AK-47%20%7C%20Redline%20%28Field-Tested%29"
             class="input w-full">
      <p class="text-xs text-slate-400 mt-1">
        Der Market-Hash wird automatisch aus der URL gelesen.
      </p>
    </div>

    <div>
      <label class="block text-sm mb-1">Name (optional, überschreibt automatisch ermittelten)</label>
      <input name="name" value="{{ it.display_name or '' }}" class="input w-full">
    </div>

    <div id="buy-field">
      <label class="block text-sm mb-1">Kaufpreis (optional, EUR)</label>
      <input name="buy_eur" value="{{ it.buy_eur or '' }}" inputmode="decimal"
             placeholder="z. B. 6,50" class="input w-full">
      <p class="text-xs text-slate-400 mt-1">Bei Stückzahl &gt; 1: durchschnittlicher Kaufpreis pro Stück.</p>
    </div>

    <div>
      <label class="block text-sm mb-1">Stückzahl</label>
      <input name="quantity" value="1" inputmode="numeric" class="input w-32">
    </div>

    <div class="flex items-center gap-2">
      <button class="btn btn-amber">Hinzufügen</button>
      <a href="{{ url_for('index') }}" class="btn btn-slate">Abbrechen</a>
    </div>
  </form>
</div>

<script>
function updateBuyVisibility() {
  const isTracking = document.querySelector('input[name="item_type"][value="tracking"]').checked;
  document.getElementById('buy-field').style.display = isTracking ? 'none' : '';
}
updateBuyVisibility();
</script>

{% endblock %}
