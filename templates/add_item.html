{% extends "base.html" %}
{% block title %}Item hinzufügen · CS2 Tracker{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto rounded bg-slate-800/70 border border-slate-700 p-6">
  <h1 class="text-xl font-semibold mb-4">Item hinzufügen</h1>

  <form method="post" action="{{ url_for('add_item') }}" class="space-y-4">
    <div>
      <label class="block text-sm mb-1" for="display_name">Anzeige-Name (optional)</label>
      <input id="display_name" name="display_name" type="text"
             class="w-full p-2 rounded bg-slate-700 border border-slate-600"
             placeholder="Wird automatisch gesetzt, wenn leer">
    </div>

    <div>
      <label class="block text-sm mb-1" for="market_hash">Market Hash (exakt wie im Steam-Markt)</label>
      <input id="market_hash" name="market_hash" type="text" required
             class="w-full p-2 rounded bg-slate-700 border border-slate-600"
             placeholder="z.B. AWP | Atheris (Field-Tested)">
    </div>

    <div>
      <label class="block text-sm mb-1" for="buy_price">Kaufpreis in EUR</label>
      <input id="buy_price" name="buy_price" type="number" step="0.01" required
             class="w-full p-2 rounded bg-slate-700 border border-slate-600" placeholder="z.B. 4.84">
    </div>

    <div class="flex items-center gap-2">
      <button class="px-4 py-2 rounded bg-amber-600 hover:bg-amber-500">Speichern</button>
      <a href="{{ url_for('index') }}" class="px-4 py-2 rounded bg-slate-500 hover:bg-slate-400">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}
