name: Deploy to NUC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          git -C $HOME/cs2tracker_full_package_arch fetch origin main
          git -C $HOME/cs2tracker_full_package_arch reset --hard origin/main

      - name: Install dependencies
        run: |
          cd $HOME/cs2tracker_full_package_arch
          .venv/bin/pip install -r requirements.txt -q

      - name: Restart service
        run: |
          sudo systemctl restart cs2tracker
