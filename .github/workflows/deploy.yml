name: Deploy to Intel NUC

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy CS2 Tracker
    runs-on: self-hosted          # läuft auf dem Runner, der auf dem NUC installiert ist

    steps:
      - name: Checkout (nur als Marker – echter Pull passiert auf dem Server)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull latest code
        run: |
          cd ${{ vars.APP_DIR }}
          git fetch origin main
          git reset --hard origin/main

      - name: Install/update Python dependencies
        run: |
          cd ${{ vars.APP_DIR }}
          .venv/bin/pip install -r requirements.txt --quiet

      - name: Restart systemd service
        run: |
          sudo systemctl restart cs2tracker
          sleep 3
          sudo systemctl is-active --quiet cs2tracker && echo "✅ cs2tracker läuft" || (echo "❌ Service-Start fehlgeschlagen" && exit 1)
